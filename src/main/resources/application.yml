spring:
    application:
        name: vibely

    jwt:
        secret: ${JWT_SECRET}
        accessTokenExpiration: 604800
        refreshTokenExpiration: 2592000

    datasource:
        url: ${JDBC_DATABASE_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            max-lifetime: 300000
            idle-timeout: 30000
            validation-timeout: 5000
